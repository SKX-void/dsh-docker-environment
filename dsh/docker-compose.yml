name: deepseek-harness-env
services:
  deepseek-harness:
    image: dsh-env:0.1.0
    container_name: dsh-env
    working_dir: /app/deepseek-harness
    networks:
      - dsh
    # 如果不指定 1000 用户， dsh 默认创造的文件是 root 用户的
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      # 挂载HOME的环境变量
      - HOME=/home/node
      # 我的代理，同时我指定了 docker 172.11.0.0/16 网络，代理监听 0.0.0.0
      - http_proxy=http://172.11.0.1:7890
      - https_proxy=http://172.11.0.1:7890
      - no_proxy=localhost,127.0.0.1,.local,172.30.0.0/16,10.0.0.0/8
    volumes:
      # dsh 及插件源码，便于 git 更新
      - ./app:/app
      # 配置目录， node:26.8.1-bookworm-slim 的 uid:1000 用户名叫node，未知密码
      - ./HOME:/home/node
      # 挂载工作区
      - ./workspace:/workspace
      # 挂载 ssh 配置
      - ./etc/ssh:/etc/ssh

    stdin_open: true
    tty: true
    # 沙箱环境需要这两个才能启动，我没研究过，ai帮我写的，欢迎指点。
    cap_add:
      - SYS_ADMIN
    security_opt:
      - seccomp=./seccomp-bwrap.json
    # 启动指令
    command: |
      sh -c "
      # 以node用户启动ssh，这样可以在外部连接容器内的ssh
        echo '>>> 启动SSH服务...' && /usr/sbin/sshd -D &
        echo '>>> 等待2秒...' && sleep 2
        echo \">>> 删除锁文件...\"
        # 这个是我的插件问题，当dsh非正常终止时，若此文件存在则无法启动
        rm -rf ~/.dsh/task-board/ledger-v2.lock
        echo \">>> 启动web服务...\"
        # 我安装了一个认证插件，用户名密码+可监听 0.0.0.0 用于docker以及认证
        pnpm dsh web --host 0.0.0.0
      "

  # 当 dsh 因为插件加载等问题停止运行时， dsh-env 容器无法进入。
  # docker exec -it dsh-fix /bin/bash #进入第二环境进行 pnpm dsh 来修复
  bash-fix:
    image: dsh-env:0.1.0
    container_name: dsh-fix
    working_dir: /app/deepseek-harness
    networks:
      - dsh
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      - HOME=/home/node
      - http_proxy=http://172.11.0.1:7890
      - https_proxy=http://172.11.0.1:7890
      - no_proxy=localhost,127.0.0.1,.local,172.11.0.0/16,10.0.0.0/8
    volumes:
      - ./app:/app
      - ./HOME:/home/node
      - ./workspace:/workspace
      - ./etc/ssh:/etc/ssh
    stdin_open: true
    tty: true
    cap_add:
      - SYS_ADMIN
    security_opt:
      - seccomp=./seccomp-bwrap.json
    command: /bin/bash
    restart: "no"

  # headroom token整理服务，不过对 dsh 似乎效果不大
  # headroom:
