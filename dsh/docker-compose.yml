name: deepseek-harness-env

configs:
  ssh_start:
    content: |
      #!/bin/sh
      echo '>>> 启动 SSH 服务...'
      /usr/sbin/sshd -D >/tmp/sshd.log 2>&1 &
  control_web_start:
    content: |
      #!/bin/sh
      set -e
      echo '>>> 启动 控制台 服务...'
      cd /app/control-web
      npm run start >/tmp/control-web.log 2>&1 &

services:
  deepseek-harness:
    image: dsh-env:0.4.0
    container_name: dsh-env
    working_dir: /app/deepseek-harness
    restart: on-failure:3
    pids_limit: 1024
    mem_limit: 8g
    memswap_limit: 8g
    networks:
      - intra
    user: "1000:1000" # 如果不指定，默认写文件是 root
    environment:
      - HOME=/home/node # 挂载HOME的环境变量
      - GIT_AUTHOR_NAME=agent
      - GIT_AUTHOR_EMAIL=agent@dsh
      - GIT_COMMITTER_NAME=agent
      - GIT_COMMITTER_EMAIL=agent@dsh
    volumes:
      - ./app:/app # dsh 及插件源码，便于 git 更新
      - ./HOME:/home/node # 配置目录， node 镜像的 uid:1000 用户名node，未知密码
      - ./workspace:/workspace
      - ./etc/ssh:/etc/ssh
    stdin_open: true
    tty: true
    # 沙箱环境需要这两个才能启动，我没研究过，ai帮我写的，欢迎指点。
    cap_add:
      - SYS_ADMIN
    security_opt:
      - seccomp=./seccomp-bwrap.json

    configs:
      - source: ssh_start
        target: /start-ssh.sh
      - source: control_web_start
        target: /start-control-web.sh
    post_start: # 要求 docker compose ^2.30.0
      - command: ["/bin/sh", "/start-ssh.sh"]
        user: "1000:1000"
      - command: ["/bin/sh", "/start-control-web.sh"]
        user: "1000:1000"

    command: | # 启动指令
      sh -c "
        rm -rf ~/.dsh/task-board/ledger-v2.lock
        echo '>>> 启动 Web 服务...'
        pnpm dsh web --no-open
      "

networks: # 确保此网络已存在
  intra:
    external: true
