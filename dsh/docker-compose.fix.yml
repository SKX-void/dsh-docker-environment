name: deepseek-harness-env-fix
services:
  # 当 dsh 因为插件加载等问题停止运行时， dsh-env 容器无法进入。
  # docker exec -it dsh-fix /bin/bash #进入第二环境进行 pnpm dsh 来修复
  bash-fix:
    image: dsh-env:0.4.0
    container_name: dsh-fix
    working_dir: /app
    networks:
      - dsh
    user: "1000:1000"
    environment:
      - HOME=/home/node
    volumes:
      - ./app:/app
      - ./HOME:/home/node
      - ./workspace:/workspace
      - ./etc/ssh:/etc/ssh
    stdin_open: true
    tty: true
    cap_add:
      - SYS_ADMIN
    security_opt:
      - seccomp=./seccomp-bwrap.json
    command: /bin/bash
    restart: "no"

networks:
  dsh:
    external: true
